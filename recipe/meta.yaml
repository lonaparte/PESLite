{% set version = "0.5.0" %}

package:
  name: peslite-distributions
  version: {{ version }}

source:
  path: ..

build:
  number: 0

outputs:
  - name: peslite-core
    build:
      noarch: python
      script: |
        {{ PYTHON }} scripts/distributions.py stage peslite-core _conda-stage/peslite-core
        {{ PYTHON }} -m pip install _conda-stage/peslite-core --no-deps --no-build-isolation -vv
    requirements:
      host:
        - python >=3.10.1
        - pip
        - setuptools >=77.0.3
      run:
        - python >=3.10.1
        - numpy >=1.24.0
        - scipy >=1.10.0
        - pyyaml >=6.0.0
    test:
      imports:
        - peslite
      commands:
        - peslite --help

  - name: peslite
    build:
      noarch: python
      script: |
        {{ PYTHON }} scripts/distributions.py stage peslite _conda-stage/peslite
        {{ PYTHON }} -m pip install _conda-stage/peslite --no-deps --no-build-isolation -vv
    requirements:
      host:
        - python >=3.10.1
        - pip
        - setuptools >=77.0.3
      run:
        - {{ pin_subpackage('peslite-core', exact=True) }}
        - matplotlib >=3.7.0
    test:
      imports:
        - peslite.addons.components.cable
        - peslite.addons.control.voltage_adaptive_pll
        - peslite.addons.functions.plotting

  - name: peslite-frontend
    build:
      noarch: python
      script: |
        {{ PYTHON }} scripts/distributions.py stage peslite-frontend _conda-stage/peslite-frontend
        {{ PYTHON }} -m pip install _conda-stage/peslite-frontend --no-deps --no-build-isolation -vv
    requirements:
      host:
        - python >=3.10.1
        - pip
        - setuptools >=77.0.3
      run:
        - {{ pin_subpackage('peslite', exact=True) }}
    test:
      imports:
        - peslite.frontend
      commands:
        - python -m peslite.frontend --help

  - name: peslite-full
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage('peslite-frontend', exact=True) }}
        - onnx >=1.17.0
        - onnxruntime >=1.18.0
    test:
      imports:
        - onnx
        - onnxruntime
        - peslite.frontend

about:
  home: https://github.com/lonaparte/PESLite
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Deterministic power electronics simulation in Python

extra:
  recipe-maintainers:
    - lonaparte
