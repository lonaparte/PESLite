name: Physical injection and identification tests

on:
  push:
    branches:
      - feature/physical-port-injection
  pull_request:
    paths:
      - "src/peslite/addons/components/port_injection.py"
      - "src/peslite/addons/control/virtual_injection.py"
      - "src/peslite/addons/functions/port_measurement.py"
      - "src/peslite/addons/functions/loop_gain.py"
      - "tests/test_port_injection.py"
      - "tests/test_port_measurement.py"
      - "tests/test_virtual_injection.py"
      - ".github/workflows/physical-injection-tests.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused injection and measurement tests
        run: >-
          python -m pytest -x
          tests/test_port_injection.py tests/test_port_measurement.py
          tests/test_virtual_injection.py
      - name: Run the complete fast regression suite
        run: python -m pytest -x
      - name: Run existing complete-loop stability regressions
        run: >-
          python -m pytest -x --run-full
          tests/test_small_signal.py tests/test_small_signal_ac.py
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Validate documentation
        run: python -m mkdocs build --strict
