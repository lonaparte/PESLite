name: GUI

on:
  workflow_call:
  pull_request:
    paths:
      - "src/peslite/gui/**"
      - "src/peslite/addons/functions/__init__.py"
      - "src/peslite/addons/functions/legacy_yaml.py"
      - "packages/distributions.json"
      - "packages/gui/pyproject.toml"
      - "scripts/distributions.py"
      - "tests/test_gui_legacy_yaml.py"
      - "tests/test_gui_preview_cache.py"
      - "tests/test_gui_web_host.py"
      - "tests/test_gui_workspace_files.py"
      - ".github/workflows/gui.yml"
  push:
    branches:
      - main
    paths:
      - "src/peslite/gui/**"
      - "src/peslite/addons/functions/__init__.py"
      - "src/peslite/addons/functions/legacy_yaml.py"
      - "packages/distributions.json"
      - "packages/gui/pyproject.toml"
      - "scripts/distributions.py"
      - "tests/test_gui_legacy_yaml.py"
      - "tests/test_gui_preview_cache.py"
      - "tests/test_gui_web_host.py"
      - "tests/test_gui_workspace_files.py"
      - ".github/workflows/gui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui:
    name: Test and build GUI
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -e ".[test]"

      - name: Run GUI host tests
        run: >-
          python -m pytest -q
          tests/test_gui_workspace_files.py
          tests/test_gui_legacy_yaml.py
          tests/test_gui_web_host.py
          tests/test_gui_preview_cache.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/peslite/gui/preview/package-lock.json

      - name: Install dependencies
        working-directory: src/peslite/gui/preview
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run tests
        working-directory: src/peslite/gui/preview
        run: npm test

      - name: Build browser bundles
        working-directory: src/peslite/gui/preview
        run: npm run build

      - name: Install workspace UI dependencies
        working-directory: src/peslite/gui/ui
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build workspace UI
        working-directory: src/peslite/gui/ui
        run: npm run build

      - name: Install VS Code extension dependencies
        working-directory: src/peslite/gui/vscode
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build VS Code extension
        working-directory: src/peslite/gui/vscode
        run: npm run build

      - name: Validate distribution ownership
        run: python scripts/distributions.py validate

      - name: Verify generated GUI assets
        run: |
          test -f src/peslite/gui/web_dist/index.html
          test -f src/peslite/gui/vscode/media/index.html
          python -m peslite.gui.web_service --help
