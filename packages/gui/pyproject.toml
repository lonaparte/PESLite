[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "peslite-gui"
version = "0.5.2"
description = "GUI interface for PESLite."
readme = "README.md"
requires-python = ">=3.10.1"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["peslite==0.5.2"]

[project.urls]
Homepage = "https://github.com/lonaparte/PESLite"
Repository = "https://github.com/lonaparte/PESLite"
Issues = "https://github.com/lonaparte/PESLite/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["peslite.gui*"]
namespaces = true

[tool.setuptools.package-data]
"peslite.gui" = ["preview/dist/*.js"]
