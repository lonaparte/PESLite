base:
  s_base: 2000000.0
  v_ll_rms: 690.0
  f0: 50.0
buses:
  pcc:
    c_pu: 0.02
    r_d_pu: 0.5
sources:
  grid:
    bus: pcc
    x_pu: 0.4
    r_pu: 0.04
    events:
      freq_step_t: 4.0
      freq_step_hz: -0.2
units:
  vsc:
    bus: pcc
    ac_filter:
      l_f_pu: 0.2
      r_f_pu: 0.01
    dclink:
      vdc_ref: 1500.0
      source:
        type: voltage
        v_pu: 1.0
    pwm:
      update_period: 5e-05
      f_sw: 20000.0
      modulation_limit: 0.95
      carrier_phase: 0.0
    control:
      type: gfm
      loops:
        power:
          type: power
          period: 5.0e-05
          bw_hz: 5.0
        sync:
          type: droop
          period: 5.0e-05
          m_p_pu: 6.2832
          n_q_pu: 0.05
        va:
          type: virtual_admittance
          period: 5.0e-05
          r_v_pu: 0.05
          x_v_pu: 0.25
          current_limit_pu: 1.2
        cc:
          type: dq_current_pi
          period: 5.0e-05
          bw_hz: 200.0
          antiwindup: conditional
      references:
        p_ref_pu: 0.5
        q_ref_pu: 0.0
        v_ref_pu: 1.0
    delay:
      steps: 1
    protection:
      i_alarm_pu: 1.5
      hold_s: 0.02
    events:
      startup:
        start: 0.2
        duration: 1.0
      setpoint:
        t: 2.0
        p_ref_pu: 0.8
simulation:
  t_end: 6.0
  bridge: averaged
  solver:
    type: fixed
    method: rk4
    dt: 1.25e-05
  log:
    plant_period: 0.0005
    control_every: 10
  stop_on_trip: true
initial:
  t: 0.0           # default: capacitors at 1 pu, every other state 0
output:
  states: true
  signals: false
