[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "peslite"
version = "0.4.0"
description = "Open-source, lightweight, multirate, and extensible power electronics simulator in Python. Designed as a deterministic simulation backend for LLM reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
all = ["matplotlib>=3.7"]
test = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
peslite = "peslite.solver.simulation:main"
peslite-convert = "peslite.solver.simulation:convert_main"

[project.urls]
Homepage = "https://github.com/lonaparte/PESLite"
Documentation = "https://github.com/lonaparte/PESLite/wiki"
Repository = "https://github.com/lonaparte/PESLite"
Issues = "https://github.com/lonaparte/PESLite/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/peslite/examples" = ["examples/*.pes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
