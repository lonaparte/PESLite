[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "peslite-core"
version = "0.6.0"
description = "Core runtime for the PESLite power electronics simulator."
readme = "README.md"
requires-python = ">=3.11.0"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
]

[dependency-groups]
onnx-test = ["onnx>=1.17.0", "onnxruntime>=1.18.0"]

[project.scripts]
peslite = "peslite.cli:main"

[project.urls]
Homepage = "https://github.com/lonaparte/PESLite"
Documentation = "https://github.com/lonaparte/PESLite/wiki"
Repository = "https://github.com/lonaparte/PESLite"
Issues = "https://github.com/lonaparte/PESLite/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/peslite/examples/templates" = ["examples/templates/*.pes", "examples/templates/*.py"]

[tool.setuptools.package-data]
"peslite.addons" = ["addons.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "static: configuration, interface and packaging checks run before numerical tests",
    "fast: short tests selected by default",
    "long: compiler, external-reference or long numerical integration tests",
    "ui: graphical-interface tests",
    "serial: resource-intensive tests that require a non-parallel pytest run",
    "motulator: cross-checks PESLite against the pinned motulator reference simulator",
    "pyspice: optional DC-converter and WPT cross-checks against PySpice and ngspice",
    "openpels: cross-checks against pinned native-ngspice cases from OpenPELS",
    "onnx: optional black-box compatibility tests against ONNX Runtime",
]
