[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "peslite"
version = "0.4.0"
description = "Open-source, lightweight, multirate, and extensible power electronics simulator in Python. Designed as a deterministic simulation backend for LLM reasoning."
readme = "README.md"
requires-python = ">=3.10.1"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7.0"]
all = ["matplotlib>=3.7.0", "onnx>=1.17.0", "onnxruntime>=1.18.0"]
test = ["pytest>=7.0.0", "matplotlib>=3.7.0"]
reference = ["motulator==0.21.0; python_version >= '3.12'"]
pyspice = ["PySpice==1.5.0"]
onnx = ["onnx>=1.17.0", "onnxruntime>=1.18.0"]

[project.scripts]
peslite = "peslite.solver.simulation:main"

[project.urls]
Homepage = "https://github.com/lonaparte/PESLite"
Documentation = "https://github.com/lonaparte/PESLite/wiki"
Repository = "https://github.com/lonaparte/PESLite"
Issues = "https://github.com/lonaparte/PESLite/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/peslite/examples" = ["examples/*.pes"]
"share/peslite/examples/templates" = ["examples/templates/*.pes", "examples/templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "static: configuration, interface and packaging checks run before numerical tests",
    "full: compiler, external-reference or long numerical integration tests",
    "motulator: cross-checks PESLite against the pinned motulator reference simulator",
    "pyspice: optional DC-converter and WPT cross-checks against PySpice and ngspice",
    "onnx: optional black-box compatibility tests against ONNX Runtime",
]
